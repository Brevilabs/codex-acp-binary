name: Publish vetted candidate
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Native packages run whose exact artifacts were approved
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: packages-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python scripts/release.py candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-inputs
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - run: cp candidate-inputs.json inputs.json
      - run: python scripts/release.py publish
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_INPUTS_SHA256: ${{ vars.APPROVED_INPUTS_SHA256 }}
          APPROVED_PACKAGING_SHA: ${{ vars.APPROVED_PACKAGING_SHA }}
          APPROVED_ARTIFACTS_SHA256: ${{ vars.APPROVED_ARTIFACTS_SHA256 }}
          DISTRIBUTION_EVIDENCE_URL: ${{ vars.DISTRIBUTION_EVIDENCE_URL }}
